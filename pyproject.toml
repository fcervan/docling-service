[project]
name = "docling-service"
version = "1.0.0"
description = "Serviço HTTP para converter documentos no JSON estruturado do Docling"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
